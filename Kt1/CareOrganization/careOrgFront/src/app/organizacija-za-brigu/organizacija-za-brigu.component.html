<div class="container">
    <div class="form-container">
      <h2>Organizacija za Brigu o Zečevima</h2>
      <form (ngSubmit)="onSubmit()">
        <label for="name">Naziv:</label>
        <input type="text" id="name" [(ngModel)]="naziv" name="name" required />
  
        <label for="latitude">Latitude:</label>
        <input type="number" id="latitude" [(ngModel)]="latitude" name="latitude" required />
  
        <label for="longitude">Longitude:</label>
        <input type="number" id="longitude" [(ngModel)]="longitude" name="longitude" required />
  
        <button type="submit">Pošaljite Poruku</button>
      </form>
    </div>
  </div>
